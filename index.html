    <!-- All 5 themes' display fonts load upfront (not per-theme) so

    <link

    />

    <!-- ============================================================
         THEME SELECTION — runs synchronously, before first paint,
         so there's never a flash of the wrong theme. Priority:
         1. ?theme=NAME in the URL (for sharing/demoing a specific one)
         2. Otherwise, a random pick from the 5 themes every visit.
         The actual color/font values live in src/styles/themes.css
         as [data-theme="..."] blocks; this script only decides WHICH
         one applies. See src/context/ThemeContext.jsx for the React
         side (lets components read/change it after mount). -->
    <script>
      (function () {
        var THEMES = ['terminal', 'kinetic', 'pearl', 'gotham', 'voyage'];
        var BG_COLORS = {
          terminal: '#0A0A0A',
          kinetic:  '#0D0A1A',
          pearl:    '#17130F',
          gotham:   '#060607',
          voyage:   '#0B1F2A',
        };
        var params = new URLSearchParams(window.location.search);
        var requested = params.get('theme');
        var theme = THEMES.indexOf(requested) !== -1
          ? requested
          : THEMES[Math.floor(Math.random() * THEMES.length)];
        document.documentElement.setAttribute('data-theme', theme);
        var themeColorTag = document.querySelector('meta[name="theme-color"]');
        if (themeColorTag) themeColorTag.setAttribute('content', BG_COLORS[theme]);
      })();
    </script>
